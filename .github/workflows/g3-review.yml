name: Independent G3 Evidence Review

on:
  workflow_dispatch:
    inputs:
      evidence_artifact_name:
        description: Existing evidence artifact in this reviewer repository
        required: true
        type: string
      evidence_artifact_run_id:
        description: Run ID that produced the evidence artifact
        required: true
        type: string
      g3_path:
        description: Path to the G3 successor contract inside the checkout
        required: true
        type: string
      readback_bundle_path:
        description: Path to the preflight readback bundle
        required: true
        type: string
      runtime_release_path:
        description: Path to the fresh runtime/release mapping
        required: true
        type: string
      reviewer_id:
        description: Independent Reviewer identity
        required: true
        default: independent-reviewer-github-actions
        type: string
      implementation_actor_id:
        description: Implementation actor identity
        required: true
        type: string
      issuer_actor_id:
        description: Canonical issuer actor identity
        required: true
        type: string
      evidence_bundle_sha256:
        description: SHA-256 of the evidence bundle under review
        required: true
        type: string
      reviewed_at:
        description: Review start time in UTC, RFC3339 with Z
        required: true
        type: string
      expires_at:
        description: Review expiry in UTC, no more than 24 hours after reviewed_at
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  independent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewer source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Download pre-collected evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: ${{ inputs.evidence_artifact_name }}
          path: _workspace/g3-evidence
          run-id: ${{ inputs.evidence_artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Pin workflow source digest
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/g3-review.yml
          WORKFLOW_SHA256="$(sha256sum .github/workflows/g3-review.yml | awk '{print $1}')"
          echo "WORKFLOW_SHA256=$WORKFLOW_SHA256" >> "$GITHUB_ENV"

      - name: Run independent read-only review
        env:
          INPUT_G3_PATH: ${{ inputs.g3_path }}
          INPUT_READBACK_BUNDLE_PATH: ${{ inputs.readback_bundle_path }}
          INPUT_RUNTIME_RELEASE_PATH: ${{ inputs.runtime_release_path }}
          INPUT_REVIEWER_ID: ${{ inputs.reviewer_id }}
          INPUT_IMPLEMENTATION_ACTOR_ID: ${{ inputs.implementation_actor_id }}
          INPUT_ISSUER_ACTOR_ID: ${{ inputs.issuer_actor_id }}
          INPUT_EVIDENCE_BUNDLE_SHA256: ${{ inputs.evidence_bundle_sha256 }}
          INPUT_REVIEWED_AT: ${{ inputs.reviewed_at }}
          INPUT_EXPIRES_AT: ${{ inputs.expires_at }}
          INPUT_REPOSITORY: ${{ github.repository }}
          INPUT_REVIEW_RUN_ID: github-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _workspace/reviewer-output
          python3 reviewer.py \
            --g3 "$INPUT_G3_PATH" \
            --readback-bundle "$INPUT_READBACK_BUNDLE_PATH" \
            --runtime-release "$INPUT_RUNTIME_RELEASE_PATH" \
            --reviewer-id "$INPUT_REVIEWER_ID" \
            --implementation-actor-id "$INPUT_IMPLEMENTATION_ACTOR_ID" \
            --issuer-actor-id "$INPUT_ISSUER_ACTOR_ID" \
            --repository "https://github.com/$INPUT_REPOSITORY" \
            --workflow-path ".github/workflows/g3-review.yml" \
            --workflow-source-sha256 "$WORKFLOW_SHA256" \
            --review-run-id "$INPUT_REVIEW_RUN_ID" \
            --evidence-bundle-sha256 "$INPUT_EVIDENCE_BUNDLE_SHA256" \
            --reviewed-at "$INPUT_REVIEWED_AT" \
            --expires-at "$INPUT_EXPIRES_AT" \
            --now "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --output _workspace/reviewer-output/independent-g3-review.json

      - name: Attest independent review record
        id: attest-review
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: _workspace/reviewer-output/independent-g3-review.json
          push-to-registry: false
          show-summary: false

      - name: Stage the signed bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest-review.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          install -m 0600 "$BUNDLE_PATH" _workspace/reviewer-output/independent-g3-review.attestation.json

      - name: Upload review record and attestation bundle
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: independent-g3-review-${{ github.run_id }}
          path: |
            _workspace/reviewer-output/independent-g3-review.json
            _workspace/reviewer-output/independent-g3-review.attestation.json
          if-no-files-found: error
